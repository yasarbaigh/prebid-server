server {
    listen 80;
    server_name ssp.local.com ssp.yugmify.com;

    access_log off;
    error_log /var/log/nginx/pbs_cluster_error.log crit;

    location / {
        proxy_pass http://pbs_cluster_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_send_timeout 150ms;
        proxy_read_timeout 150ms; # Fail fast if RTB times out
    }
}

server {
    listen 443 ssl;
    server_name ssp.local.com ssp.yugmify.com;

    # Update cert paths to real certs
    # ssl_certificate /etc/nginx/ssl/ssp_cluster.crt;
    # ssl_certificate_key /etc/nginx/ssl/ssp_cluster.key;

    access_log off;
    error_log /var/log/nginx/pbs_cluster_ssl_error.log crit;

    location / {
        proxy_pass http://pbs_cluster_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_send_timeout 150ms;
        proxy_read_timeout 150ms;
    }
}
