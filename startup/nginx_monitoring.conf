# Nginx Monitoring Configuration
# Proxmies Prometheus (9090) and Grafana (3000) for local development
# To activate: sudo ln -sf /opt/app_adserving/1_prebid-server/startup/nginx_monitoring.conf /etc/nginx/sites-enabled/monitoring

upstream prometheus_backend {
    server 127.0.0.1:9090;
    keepalive 32;
}

upstream grafana_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 1. Prometheus Server Block
server {
    listen 80;
    server_name prometheus.local prometheus.a1.com prom.a1.com;

    #access_log /var/log/nginx/prometheus_access.log;
    access_log off;
    error_log /var/log/nginx/prometheus_error.log;

    location / {
        proxy_pass http://prometheus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (optional but good practice for streaming UI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 2. Grafana Server Block
server {
    listen 80;
    server_name grafana.local grafana.a1.com gf.a1.com;

    #access_log /var/log/nginx/grafana_access.log;
    access_log off;
    error_log /var/log/nginx/grafana_error.log;

    location / {
        proxy_pass http://grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # High-performance settings for long-lived dashboard connections
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # WebSocket support (essential for Grafana's live features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
