# Nginx Configuration for Prebid Server - Instance 1 Only
# To activate: ln -s /opt/adserving/14-feb-2026/1_prebid-server/startup/nginx_instance_1.conf /etc/nginx/sites-enabled/pbs_instance_1

upstream pbs_instance_1_backend {
    # Instance 1 RTB Ports (24001 - 24020)
    server 127.0.0.1:24001; server 127.0.0.1:24002; server 127.0.0.1:24003; server 127.0.0.1:24004;
    server 127.0.0.1:24005; server 127.0.0.1:24006; server 127.0.0.1:24007; server 127.0.0.1:24008;
    server 127.0.0.1:24009; server 127.0.0.1:24010; server 127.0.0.1:24011; server 127.0.0.1:24012;
    server 127.0.0.1:24013; server 127.0.0.1:24014; server 127.0.0.1:24015; server 127.0.0.1:24016;
    server 127.0.0.1:24017; server 127.0.0.1:24018; server 127.0.0.1:24019; server 127.0.0.1:24020;
    
    keepalive 256; # Keep connections open for high throughput
}

# HTTP - Port 80
server {
    listen 80;
    server_name ssp.local.com ssp.yugmify.com;

    # Performance: Minimize Logging
    access_log off;
    error_log /var/log/nginx/pbs_i1_error.log crit;

    location / {
        proxy_pass http://pbs_instance_1_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# HTTPS - Port 443
server {
    listen 443 ssl;
    server_name ssp.local.com ssp.yugmify.com;

    # SSL Config (Paths must be updated to real certs)
    # ssl_certificate /etc/nginx/ssl/ssp_bundle.crt;
    # ssl_certificate_key /etc/nginx/ssl/ssp.key;

    access_log off;
    error_log /var/log/nginx/pbs_i1_ssl_error.log crit;

    location / {
        proxy_pass http://pbs_instance_1_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
