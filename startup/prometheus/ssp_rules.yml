groups:
  - name: ssp_metrics
    rules:
      # SSP Request Rate (QPS)
      - record: job:ssp_requests:rate5m
        expr: sum(rate(prebid_rtb_ssp_requests_total[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, instance_id)

      # SSP Validation Failure Rate
      - record: job:ssp_validation_failed:rate5m
        expr: sum(rate(prebid_rtb_ssp_validation_failed_total[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, instance_id)

      # SSP Response Rate by Status
      - record: job:ssp_responses:rate5m
        expr: sum(rate(prebid_rtb_ssp_responses_total[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, status, instance_id)

      # SSP Success Percentage (OK status)
      - record: ssp:success_rate:ratio5m
        expr: >
          sum(rate(prebid_rtb_ssp_responses_total{status="ok"}[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, instance_id)
          /
          sum(rate(prebid_rtb_ssp_requests_total[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, instance_id)

      # SSP No-Bid Percentage
      - record: ssp:nobid_rate:ratio5m
        expr: >
          sum(rate(prebid_rtb_ssp_responses_total{status="no_bid"}[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, instance_id)
          /
          sum(rate(prebid_rtb_ssp_requests_total[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, instance_id)

      # SSP Error Percentage
      - record: ssp:error_rate:ratio5m
        expr: >
          sum(rate(prebid_rtb_ssp_responses_total{status="error"}[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, instance_id)
          /
          sum(rate(prebid_rtb_ssp_requests_total[5m])) by (tenant_identifier, ssp_identifier, ssp_inventory_identifier, instance_id)

  - name: ssp_alerts
    rules:
      # Alert if SSP Error Rate > 10%
      - alert: SSPHighErrorRate
        expr: ssp:error_rate:ratio5m > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate for SSP {{ $labels.ssp_identifier }}"
          description: "SSP {{ $labels.ssp_identifier }} for tenant {{ $labels.tenant_identifier }} has an error rate of {{ $value | printf \"%.2f\" }}%."
