global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "ssp_rules.yml"
  - "dsp_rules.yml"

scrape_configs:
  - job_name: 'prebid_cluster'
    static_configs:
      - targets:
          - 'localhost:24029' # Instance 1 (Base 24000 + 29)
          - 'localhost:24059' # Instance 2 (Base 24030 + 29)
          - 'localhost:24089' # Instance 3 (Base 24060 + 29)
          - 'localhost:24119' # Instance 4 (Base 24090 + 29)
          - 'localhost:24149' # Instance 5 (Base 24120 + 29)
    relabel_configs:
      - source_labels: [__address__]
        regex: '.*:24029'
        target_label: 'instance_id'
        replacement: '1'
      - source_labels: [__address__]
        regex: '.*:24059'
        target_label: 'instance_id'
        replacement: '2'
      - source_labels: [__address__]
        regex: '.*:24089'
        target_label: 'instance_id'
        replacement: '3'
      - source_labels: [__address__]
        regex: '.*:24119'
        target_label: 'instance_id'
        replacement: '4'
      - source_labels: [__address__]
        regex: '.*:24149'
        target_label: 'instance_id'
        replacement: '5'

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['localhost:9091']
    relabel_configs:
      - source_labels: [__address__]
        target_label: 'instance'
        replacement: 'shared_pushgateway'
