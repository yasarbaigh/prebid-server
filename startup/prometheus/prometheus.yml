global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 1. Rule Files (Pre-calculated metrics and alerts)
rule_files:
  - "/etc/prometheus/rules/ssp_rules.yml"
  - "/etc/prometheus/rules/dsp_rules.yml"

# 2. Scrape Configurations (Minimal & Externalized)
scrape_configs:
  # Prebid Server RTB Instances (Multiple Ports)
  - job_name: 'prebid_cluster'
    fallback_scrape_protocol: PrometheusText1.0.0
    file_sd_configs:
      - files: ['/etc/prometheus/rules/prebid_targets.yml']

  # Node Exporter (System CPU/Mem/Disk)
  - job_name: 'node'
    fallback_scrape_protocol: PrometheusText1.0.0
    file_sd_configs:
      - files: ['/etc/prometheus/rules/node_targets.yml']

  # PM2 & Process Exporters
  - job_name: 'pm2-cluster'
    # Required for Prometheus 3+ compatibility with some exporters
    scrape_protocols: [PrometheusProto, PrometheusText1.0.0, OpenMetricsText1.0.0]
    fallback_scrape_protocol: PrometheusText1.0.0
    file_sd_configs:
      - files: ['/etc/prometheus/rules/pm2_targets.yml']

  # Pushgateway (Bridge for batch/short-lived tasks)
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['localhost:9091']
    relabel_configs:
      - target_label: 'instance'
        replacement: 'shared_pushgateway'