global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - "rules/ssp_rules.yml"
  - "rules/dsp_rules.yml"
scrape_configs:
  - job_name: 'prebid_cluster'
    static_configs:
      - targets: ['localhost:24029', 'localhost:24059', 'localhost:24089', 'localhost:24119', 'localhost:24149']
    relabel_configs:
      - source_labels: [__address__]
        regex: '.*:24029'
        target_label: 'instance_id'
        replacement: '1'
      - source_labels: [__address__]
        regex: '.*:24059'
        target_label: 'instance_id'
        replacement: '2'
      - source_labels: [__address__]
        regex: '.*:24089'
        target_label: 'instance_id'
        replacement: '3'
      - source_labels: [__address__]
        regex: '.*:24119'
        target_label: 'instance_id'
        replacement: '4'
      - source_labels: [__address__]
        regex: '.*:24149'
        target_label: 'instance_id'
        replacement: '5'
  - job_name: 'pushgateway'
    honor_labels: true
    fallback_scrape_protocol: PrometheusText1.0.0
    static_configs:
      - targets: ['localhost:9091']
    relabel_configs:
      - source_labels: [__address__]
        target_label: 'instance'
        replacement: 'shared_pushgateway'
  - job_name: 'pm2-cluster'
    # Fix for Prometheus 3.x strictness with blank Content-Type
    scrape_protocols: [PrometheusProto, PrometheusText1.0.0, OpenMetricsText1.0.0]
    fallback_scrape_protocol: PrometheusText1.0.0
    file_sd_configs:
      - files: ['/etc/prometheus/rules/pm2_targets.yml']
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']