syntax = "proto3";
package log;

option go_package = "github.com/prebid/prebid-server/v3/proto/generated";

message App {
    string id = 1;
    string name = 2;
    string bundle = 3;
    string domain = 4;
}

message Web {
    string domain = 1;
    string page = 2;
}

message AuctionEvent {
    // 1. Identity & Context
    uint32 tenant_id = 1;
    uint32 ssp_partner_id = 2;
    uint32 ssp_inventory_id = 3;
    string ssp_partner_auction_id = 4; // bidrequest.id

    // 2. Transacting Partners
    uint32 dsp_partner_id = 5;
    uint32 dsp_inventory_id = 6;

    // 3. User & Privacy
    string ip = 7;
    string user_agent = 8;
    string ifa = 9;
    string gdpr_consent = 10;

    // 4. Financials
    double bid_request_price = 11; // Floor/Req Price
    double dsp_price = 12;         // Winning Bid Price (Before Margin)
    double ssp_price = 13;         // Final Bid Price (After Margin)

    // 5. Device Dimensions
    string device_type = 14;
    string os = 15;
    string osv = 16;
    string carrier = 17;

    // 6. Geography & Traffic Source
    string country = 18;
    string site_app_domain = 19;
    string bundle_id = 20;

    // 7. Ad Details & Selection
    string ad_type = 21;
    string ad_size = 22;
    string creative_id = 23;
    string ad_domain = 24;
    string deal_id = 25;
    bool is_pmp = 26;

    // 8. Winning Audit
    string winning_bid_id = 27;
    string imp_id = 28;
    string seat_id = 29;

    // 9. Source Environment (Oneof)
    oneof source {
        App app = 30;
        Web web = 31;
    }

    // 10. System Metadata
    int64 timestamp = 32;         // Unix timestamp in MS
    string hostname = 33;         // Device/Server hostname

    // 11. Raw Payloads
    bytes raw_bid_request = 34;
    bytes ssp_dsp_response = 35;

    // 12. Model & Metadata
    uint32 pricing_at = 36;
    string ad_id = 37;
}
